<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FST 16 Drivetrain Tracker</title>
  <meta name="theme-color" content="#0e1117">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="katex.min.css">
  <link rel="stylesheet" href="styles.css?v=20261025_02">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">FST 16 Drivetrain</div>
      </div>
      <div id="sidebarNav" style="overflow-y: auto; flex: 1;">
        <!-- Dynamically populated by app.js -->
      </div>
      <div class="sidebar-footer">
        <div id="userRoleBar" class="role-bar"></div>
        <button id="btnOpenSync" class="btn-sync-cloud">Cloud Settings</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="contentArea">
      <div style="padding: 3rem; text-align: center; color: var(--text-muted);">
        Loading Tracker Data...
      </div>
    </main>
  </div>

  <!-- Dynamic Modals Container -->
  <div id="modalContainer"></div>

  <!-- SheetJS, Tesseract OCR, Marked, KaTeX & Core Scripts -->
  <script src="xlsx.full.min.js"></script>
  <script src="tesseract.min.js"></script>
  <script src="marked.min.js"></script>
  <script src="katex.min.js"></script>
  <script src="github-sync.js?v=20261025_02"></script>
  <script src="app.js?v=20261025_02"></script>
</body>
</html>
